<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09100d">
    <meta name="description" content="NatX — Nathaniel Asiak's interactive portfolio terminal.">
    <title>NatX — Nathaniel Asiak</title>
    <style>
      :root { --bg:#09100d; --surface:#0e1812; --line:#254030; --ink:#e8f4e9; --muted:#8ca58f; --accent:#71f29a; --cyan:#79dce8; --warn:#f4c76c; --red:#f18778; }
      * { box-sizing:border-box; }
      body { background:var(--bg); color:var(--ink); font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; margin:0; min-height:100vh; }
      button, input { font:inherit; }
      .shell { margin:clamp(1rem, 4vw, 3.5rem) auto; max-width:1000px; padding:0 1rem; }
      .topbar { align-items:center; border:1px solid var(--line); border-bottom:0; border-radius:12px 12px 0 0; display:flex; height:42px; justify-content:space-between; padding:0 14px; }
      .dots { display:flex; gap:7px; } .dot { border-radius:50%; height:10px; width:10px; } .dot:nth-child(1){background:#f18778}.dot:nth-child(2){background:#f4c76c}.dot:nth-child(3){background:#71f29a}
      .title { color:var(--muted); font-size:.73rem; letter-spacing:.08em; text-transform:uppercase; } .status { color:var(--accent); font-size:.72rem; }
      main { background:linear-gradient(145deg, rgba(20,42,28,.55), transparent 45%), var(--surface); border:1px solid var(--line); min-height:640px; padding:clamp(1.1rem, 3vw, 2.25rem); }
      .output { font-size:clamp(.82rem, 1.6vw, .96rem); line-height:1.65; overflow-wrap:anywhere; }
      .line { margin:0 0 .7rem; white-space:pre-wrap; } .muted { color:var(--muted); } .accent { color:var(--accent); } .cyan { color:var(--cyan); } .warn { color:var(--warn); } .error { color:var(--red); }
      .ascii { color:var(--accent); font-size:clamp(.53rem, 1.25vw, .85rem); line-height:1.2; margin:0 0 1.4rem; overflow:hidden; white-space:pre; }
      a { color:var(--cyan); text-decoration:underline; text-underline-offset:3px; } a:hover { color:var(--accent); }
      .prompt-row { align-items:center; display:flex; gap:.65rem; margin-top:.85rem; } .prompt { color:var(--accent); flex:0 0 auto; font-size:clamp(.76rem, 1.5vw, .94rem); font-weight:700; }
      #command { background:transparent; border:0; caret-color:var(--accent); color:var(--ink); font-size:clamp(.82rem, 1.6vw, .96rem); min-width:0; outline:0; padding:0; width:100%; }
      .hint { color:var(--muted); font-size:.73rem; margin-top:1.6rem; } kbd { border:1px solid var(--line); border-radius:4px; color:var(--ink); font-size:.7rem; padding:.08rem .3rem; }
      .command { color:var(--accent); } .table { display:grid; gap:.25rem; grid-template-columns:minmax(8rem, 13rem) 1fr; margin:.25rem 0 1rem; } .table b { color:var(--cyan); font-weight:500; }
      .back { color:var(--muted); display:inline-block; font-size:.78rem; margin-top:1rem; text-decoration:none; } .back:hover { color:var(--accent); }
      .light { --bg:#edf7ee; --surface:#ffffff; --line:#bad1bd; --ink:#162119; --muted:#5d7461; --accent:#087c37; --cyan:#047787; --warn:#9a6800; --red:#b13d30; }
      @media (max-width:560px) { .shell { margin:0; padding:0; }.topbar { border-left:0; border-radius:0; border-right:0; }.status { display:none; } main { border-left:0; border-right:0; min-height:calc(100vh - 42px); padding:1.1rem; }.table { grid-template-columns:1fr; gap:0; margin-bottom:.8rem; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar"><div class="dots" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><span class="title">natx · interactive portfolio</span><span class="status">● online</span></div>
      <main id="terminal" aria-label="NatX interactive terminal" role="application">
        <div id="output" class="output"></div>
        <form id="prompt-form" class="prompt-row" autocomplete="off"><label class="prompt" for="command">nat@asiak:~$</label><input id="command" autofocus autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Terminal command"></form>
        <p class="hint">Type <kbd>help</kbd> to explore · use <kbd>↑</kbd>/<kbd>↓</kbd> for history · <kbd>Tab</kbd> to complete</p>
        <a class="back" href="/">← return to portfolio</a>
      </main>
    </div>
    <script>
      (() => {
        const output = document.querySelector('#output');
        const form = document.querySelector('#prompt-form');
        const input = document.querySelector('#command');
        const terminal = document.querySelector('#terminal');
        const history = []; let position = 0;
        const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
        const write = html => { const line = document.createElement('div'); line.className = 'line'; line.innerHTML = html; output.append(line); window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' }); };
        const commands = {
          help() { write(`<span class="accent">Available commands</span>\n\n<span class="cyan">about</span>       who is Nat?\n<span class="cyan">research</span>    current research directions\n<span class="cyan">projects</span>    selected work\n<span class="cyan">blog</span>        recent writing\n<span class="cyan">contact</span>     ways to connect\n<span class="cyan">resume</span>      download CV\n<span class="cyan">open &lt;name&gt;</span> open a project or section\n<span class="cyan">ls</span>          list this directory\n<span class="cyan">theme</span>       toggle light / dark mode\n<span class="cyan">clear</span>       clear the terminal\n<span class="cyan">help</span>        show this message`); },
          about() { write(`<span class="accent"># Nathaniel Asiak</span>\n\nIncoming MS student in Computational and Mathematical Engineering at Stanford. I work on machine learning methods for complex visual and multimodal data—with an emphasis on embodied AI and long-horizon tasks.\n\n<span class="muted">Current focus:</span> perception · representation learning · deployed autonomy`); },
          research() { write(`<span class="accent">Research / active threads</span>\n<div class="table"><b>01 · perception</b><span>Grounding open-ended events in fielded multi-camera systems.</span><b>02 · autonomy</b><span>Long-horizon control under state drift in GPS-denied underwater vehicles.</span><b>03 · embodiment</b><span>How compute, sensors, morphology, and control shape an agent's capability.</span></div>Try <span class="command">open cameras</span> or <span class="command">open underwater</span>.`); },
          projects() { write(`<span class="accent">Selected work</span>\n<div class="table"><b>cameras/</b><span>Grounded perception & long-horizon reasoning</span><b>underwater/</b><span>Embodiment, drift & control in ROVs</span><b>arm/</b><span>Modelling a 5-DOF robotic arm</span><b>thesis/</b><span>Memory-efficient ML for heart sounds</span></div>Use <span class="command">open &lt;name&gt;</span> to read more.`); },
          blog() { write(`<span class="accent">Recent notes</span>\n\n→ <a href="/post/lever-arm-effect/">Why Your Robot's IMU Is Lying to You</a>\n→ <a href="/post/openfga/">Why Zanzibar matters</a>\n→ <a href="/post/coordinate-frames/">Coordinate Frames and Transformations in Robotics</a>\n\n<a href="/post/">Browse all writing →</a>`); },
          contact() { write(`Find me on <a href="https://www.linkedin.com/in/nathanielasiak" target="_blank" rel="noopener">LinkedIn</a>, <a href="https://github.com/AsiakN" target="_blank" rel="noopener">GitHub</a>, or <a href="https://twitter.com/NathanielAsiak" target="_blank" rel="noopener">X / Twitter</a>.`); },
          resume() { write(`Opening <a href="/uploads/resume.pdf" target="_blank">Nathaniel Asiak — CV.pdf</a>`); },
          ls() { write(`<span class="cyan">about.txt</span>  <span class="cyan">research/</span>  <span class="cyan">projects/</span>  <span class="cyan">blog/</span>  <span class="cyan">contact.txt</span>  <span class="cyan">resume.pdf</span>`); },
          theme() { document.body.classList.toggle('light'); write(`<span class="muted">Theme switched to ${document.body.classList.contains('light') ? 'light' : 'dark'}.</span>`); },
          clear() { output.innerHTML = ''; },
          open(arg) { const pages = { cameras:['/publication/current-research/','Grounded Perception and Long-Horizon Reasoning'], underwater:['/publication/underwater-autonomy/','Embodiment, Drift, and Long-Horizon Control'], arm:['/publication/technical-report/','Modeling a 5-DOF Robotic Arm'], thesis:['/publication/thesis/','Memory Efficient ML Thesis'], blog:['/post/','Blog'], research:['/publication/','Research'], projects:['/publication/','Projects'] }; const page = pages[arg]; page ? write(`Opening <a href="${page[0]}">${page[1]} →</a>`) : write(`<span class="error">natx: open: '${esc(arg || '')}': no such entry</span>\n<span class="muted">Try: cameras, underwater, arm, thesis, blog, or research.</span>`); },
          pwd() { write('/home/nat'); },
          whoami() { write('visitor@natx'); }
        };
        function run(raw) { const value = raw.trim(); if (!value) return; write(`<span class="prompt">nat@asiak:~$</span> <span class="command">${esc(value)}</span>`); const [name, ...args] = value.toLowerCase().split(/\s+/); const command = commands[name]; if (command) command(args.join(' ')); else write(`<span class="error">natx: command not found: ${esc(name)}</span>\n<span class="muted">Type 'help' for a list of commands.</span>`); }
        form.addEventListener('submit', event => { event.preventDefault(); const value = input.value; if (value.trim()) { history.push(value); position = history.length; run(value); } input.value = ''; });
        input.addEventListener('keydown', event => { if (event.key === 'ArrowUp') { event.preventDefault(); if (position > 0) input.value = history[--position]; } if (event.key === 'ArrowDown') { event.preventDefault(); if (position < history.length - 1) input.value = history[++position]; else { position = history.length; input.value = ''; } } if (event.key === 'Tab') { event.preventDefault(); const match = Object.keys(commands).find(key => key.startsWith(input.value.trim().toLowerCase())); if (match) input.value = match + ' '; } });
        terminal.addEventListener('click', () => input.focus());
        write(`<pre class="ascii" aria-label="NatX"> _   _       _  __  __\n| \ | | __ _| | \ \/ /\n|  \| |/ _\` | |  \  / \n| |\  | (_| | |  /  \\ \n|_| \_|\__,_|_| /_/\_\\</pre><span class="accent">Welcome to NatX.</span> An interactive index of Nathaniel Asiak's work.\n<span class="muted">This is a browser-only terminal. It never accesses your device or runs shell commands.</span>\n\nType <span class="command">help</span> to begin.`);
      })();
    </script>
  </body>
</html>
